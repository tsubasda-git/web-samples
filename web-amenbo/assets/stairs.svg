<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <!-- 学年の階段。色は css/tokens.css と同じ -->
  <g stroke="#1E2A24" stroke-width="3" stroke-linejoin="round">
    <rect x="20" y="200" width="180" height="80" rx="10" fill="#EAF4EE"/>
    <rect x="210" y="130" width="180" height="150" rx="10" fill="#EAF4EE"/>
    <rect x="400" y="60" width="180" height="220" rx="10" fill="#2F7D4F"/>
  </g>
  <g font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif" font-weight="700">
    <text x="110" y="234" text-anchor="middle" font-size="22" fill="#1E2A24">小1〜3</text>
    <text x="110" y="262" text-anchor="middle" font-size="18" fill="#1E2A24">つみき</text>
    <text x="300" y="166" text-anchor="middle" font-size="22" fill="#1E2A24">小4〜6</text>
    <text x="300" y="194" text-anchor="middle" font-size="18" fill="#1E2A24">ゲームづくり</text>
    <text x="490" y="96" text-anchor="middle" font-size="22" fill="#FFFFFF">中1〜3</text>
    <text x="490" y="124" text-anchor="middle" font-size="18" fill="#FFFFFF">テキスト</text>
  </g>
  <!-- 階段をのぼるあめんぼ（飾り） -->
  <g stroke="#1E2A24" stroke-width="2" stroke-linecap="round" fill="none">
    <ellipse cx="300" cy="112" rx="10" ry="4" fill="#C94A22" stroke="#1E2A24"/>
    <path d="M291 110 l-14 -10 M309 110 l14 -10 M292 114 l-16 10 M308 114 l16 10"/>
  </g>
</svg>
