<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <!-- 教室の平面図（架空）。色は css/tokens.css と同じ -->
  <g font-family="'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif" font-weight="700" font-size="16" fill="#1E2A24">
  <rect x="20" y="20" width="600" height="380" rx="8" fill="#FFFFFF" stroke="#1E2A24" stroke-width="4"/>
  <!-- 窓（上の壁） -->
  <line x1="120" y1="20" x2="300" y2="20" stroke="#2F7D4F" stroke-width="10"/>
  <line x1="360" y1="20" x2="540" y2="20" stroke="#2F7D4F" stroke-width="10"/>
  <text x="330" y="50" text-anchor="middle" fill="#2F7D4F">窓</text>
  <!-- 入口 -->
  <path d="M520 400 v-60 a60 60 0 0 1 60 60" fill="none" stroke="#1E2A24" stroke-width="3"/>
  <line x1="520" y1="400" x2="580" y2="400" stroke="#FFFFFF" stroke-width="6"/>
  <text x="550" y="330" text-anchor="middle">入口</text>
  <!-- 大きな画面 -->
  <rect x="40" y="130" width="16" height="140" fill="#1E2A24"/>
  <text x="72" y="206">画面</text>
  <!-- 講師の机 -->
  <rect x="110" y="150" width="70" height="100" rx="6" fill="#EAF4EE" stroke="#1E2A24" stroke-width="3"/>
  <text x="145" y="206" text-anchor="middle" font-size="14">講師</text>
  <!-- 生徒の机4つ -->
  <g fill="#EAF4EE" stroke="#1E2A24" stroke-width="3">
    <rect x="250" y="90" width="110" height="70" rx="6"/>
    <rect x="390" y="90" width="110" height="70" rx="6"/>
    <rect x="250" y="210" width="110" height="70" rx="6"/>
    <rect x="390" y="210" width="110" height="70" rx="6"/>
  </g>
  <g fill="#2F7D4F"><rect x="285" y="108" width="40" height="26" rx="3"/><rect x="425" y="108" width="40" height="26" rx="3"/><rect x="285" y="228" width="40" height="26" rx="3"/><rect x="425" y="228" width="40" height="26" rx="3"/></g>
  <text x="375" y="190" text-anchor="middle" font-size="14">生徒の机（4人まで）</text>
  <!-- 見学席 -->
  <g fill="#C94A22" stroke="#1E2A24" stroke-width="2"><circle cx="300" cy="350" r="16"/><circle cx="350" cy="350" r="16"/></g>
  <text x="325" y="388" text-anchor="middle" font-size="14">見学席（保護者2席）</text>
  <!-- 本棚・手洗い -->
  <rect x="40" y="330" width="140" height="40" rx="4" fill="#FFFFFF" stroke="#1E2A24" stroke-width="3"/>
  <text x="110" y="356" text-anchor="middle" font-size="14">本棚</text>
  <rect x="40" y="40" width="60" height="50" rx="4" fill="#FFFFFF" stroke="#1E2A24" stroke-width="3"/>
  <text x="70" y="70" text-anchor="middle" font-size="13">手洗い</text>
  </g>
</svg>
